
[functions.invite-user]
enabled = true
verify_jwt = true
import_map = "./functions/invite-user/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/invite-user/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/invite-user/*.html" ]

[functions.orbi-brief]
enabled = true
verify_jwt = true
entrypoint = "./functions/orbi-brief/index.ts"

[functions.quick-add-parse]
enabled = true
verify_jwt = true
import_map = "./functions/quick-add-parse/deno.json"
entrypoint = "./functions/quick-add-parse/index.ts"

# MCP server (Claude connector). The function verifies OAuth tokens itself -
# the gateway check has to be off so the unauthenticated discovery request
# can get the WWW-Authenticate challenge that points clients at Supabase Auth.
[functions.mcp]
enabled = true
verify_jwt = false
entrypoint = "./functions/mcp/index.ts"
